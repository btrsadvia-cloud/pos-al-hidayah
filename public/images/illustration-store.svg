<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" width="100%" height="100%" fill="none">
    <defs>
        <!-- Gradients -->
        <linearGradient id="bgMaroonGlow" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#70102e" stop-opacity="0.8"/>
            <stop offset="50%" stop-color="#4a0b1f" stop-opacity="0.95"/>
            <stop offset="100%" stop-color="#2c0411" stop-opacity="1"/>
        </linearGradient>

        <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#FDE68A"/>
            <stop offset="50%" stop-color="#F59E0B"/>
            <stop offset="100%" stop-color="#B45309"/>
        </linearGradient>

        <linearGradient id="maroonDressGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#9f1239"/>
            <stop offset="50%" stop-color="#881337"/>
            <stop offset="100%" stop-color="#4c0519"/>
        </linearGradient>

        <linearGradient id="creamGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#FFFBEB"/>
            <stop offset="100%" stop-color="#FEF3C7"/>
        </linearGradient>

        <linearGradient id="awningGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#881337"/>
            <stop offset="15%" stop-color="#9f1239"/>
            <stop offset="30%" stop-color="#FFFBEB"/>
            <stop offset="45%" stop-color="#881337"/>
            <stop offset="60%" stop-color="#FFFBEB"/>
            <stop offset="75%" stop-color="#881337"/>
            <stop offset="90%" stop-color="#FFFBEB"/>
            <stop offset="100%" stop-color="#881337"/>
        </linearGradient>

        <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="6" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="130%">
            <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
        </filter>
    </defs>

    <!-- Decorative Backdrop Arch -->
    <path d="M 120 340 L 120 130 C 120 50, 400 50, 400 130 L 400 340 Z" fill="url(#bgMaroonGlow)" opacity="0.6"/>
    <path d="M 135 340 L 135 135 C 135 70, 385 70, 385 135 L 385 340" stroke="url(#goldGrad)" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.7" fill="none"/>

    <!-- Boutique Floor Platform -->
    <ellipse cx="260" cy="335" rx="220" ry="24" fill="#1f020a" opacity="0.6"/>
    <ellipse cx="260" cy="330" rx="200" ry="18" fill="url(#goldGrad)" opacity="0.25"/>

    <!-- Store Awning Canopy on Top -->
    <g filter="url(#dropShadow)">
        <path d="M 90 85 L 430 85 L 415 118 L 105 118 Z" fill="url(#awningGrad)"/>
        <!-- Awning Scallops -->
        <path d="M 105 118 Q 120 132 135 118 Q 150 132 165 118 Q 180 132 195 118 Q 210 132 225 118 Q 240 132 255 118 Q 270 132 285 118 Q 300 132 315 118 Q 330 132 345 118 Q 360 132 375 118 Q 390 132 405 118 L 415 118 L 105 118" fill="#881337"/>
        <!-- Gold Trim -->
        <line x1="88" y1="85" x2="432" y2="85" stroke="url(#goldGrad)" stroke-width="3"/>
    </g>

    <!-- Boutique Signboard: Toko Al-Hidayah -->
    <g filter="url(#dropShadow)">
        <rect x="180" y="55" width="160" height="32" rx="8" fill="#58081f" stroke="url(#goldGrad)" stroke-width="2"/>
        <text x="260" y="76" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#FDE68A" text-anchor="middle" letter-spacing="1">TOKO AL-HIDAYAH</text>
        <!-- Crescent & Star on Sign -->
        <path d="M 195 67 A 5 5 0 1 1 200 75 A 4 4 0 1 0 195 67 Z" fill="#F59E0B"/>
        <polygon points="325,68 327,72 331,72 328,74 329,78 325,75 321,78 322,74 319,72 323,72" fill="#F59E0B" transform="scale(0.8) translate(80, 15)"/>
    </g>

    <!-- ============================================== -->
    <!-- CENTER: MANNEQUIN IN ELEGANT BUSANA MUSLIMAH -->
    <!-- ============================================== -->
    <g filter="url(#dropShadow)" transform="translate(10, 0)">
        <!-- Mannequin Stand Pole & Base -->
        <rect x="256" y="140" width="8" height="185" fill="#B45309" rx="3"/>
        <ellipse cx="260" cy="326" rx="28" ry="7" fill="url(#goldGrad)"/>

        <!-- Dress Flow / Gamis -->
        <path d="M 242 165 C 240 180, 222 280, 215 315 L 305 315 C 298 280, 280 180, 278 165 Z" fill="url(#maroonDressGrad)"/>
        <!-- Dress Pleats / Gold Embroidery Line -->
        <path d="M 260 165 L 260 315" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
        <path d="M 240 230 C 255 240, 265 240, 280 230" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>
        <path d="M 228 275 C 250 288, 270 288, 292 275" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>
        <path d="M 215 314 Q 260 324 305 314" stroke="url(#goldGrad)" stroke-width="3" fill="none"/>

        <!-- Hijab Syar'i (Cream & Gold Flow) -->
        <path d="M 238 135 C 235 160, 242 195, 260 200 C 278 195, 285 160, 282 135 C 280 115, 240 115, 238 135 Z" fill="url(#creamGrad)"/>
        <path d="M 252 130 C 250 142, 270 142, 268 130 Z" fill="#F87171" opacity="0.3"/> <!-- Face Silhouette/Cover -->
        <path d="M 240 165 Q 260 182 280 165" stroke="url(#goldGrad)" stroke-width="1.5" fill="none"/>
        <!-- Hijab Pin Jewel -->
        <circle cx="260" cy="162" r="3" fill="#F59E0B" filter="url(#softGlow)"/>
    </g>

    <!-- ============================================== -->
    <!-- LEFT: CLOTHING RACK (SERAGAM SEKOLAH & GAMIS) -->
    <!-- ============================================== -->
    <g transform="translate(100, 175)" filter="url(#dropShadow)">
        <!-- Stand Poles -->
        <line x1="0" y1="15" x2="0" y2="145" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round"/>
        <line x1="75" y1="15" x2="75" y2="145" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round"/>
        <line x1="-8" y1="15" x2="83" y2="15" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round"/>
        <ellipse cx="0" cy="145" rx="14" ry="4" fill="#6B7280"/>
        <ellipse cx="75" cy="145" rx="14" ry="4" fill="#6B7280"/>

        <!-- Hanger 1: Seragam Putih Sekolah -->
        <path d="M 12 18 L 22 28 L 2 28 Z" stroke="#E5E7EB" stroke-width="1.5" fill="none"/>
        <rect x="2" y="28" width="20" height="35" rx="3" fill="#FFFFFF"/>
        <path d="M 5 28 L 12 36 L 19 28" fill="#DC2626"/> <!-- Dasi Merah SD -->
        <rect x="4" y="63" width="16" height="30" fill="#DC2626" rx="2"/> <!-- Rok Merah -->

        <!-- Hanger 2: Seragam Pramuka Coklat -->
        <path d="M 37 18 L 47 28 L 27 28 Z" stroke="#D97706" stroke-width="1.5" fill="none"/>
        <rect x="27" y="28" width="20" height="38" rx="3" fill="#D97706"/>
        <path d="M 31 28 L 37 36 L 43 28" fill="#78350F"/>
        <rect x="29" y="66" width="16" height="28" fill="#78350F" rx="2"/>

        <!-- Hanger 3: Busana Muslimah Hijau Emerald -->
        <path d="M 62 18 L 72 28 L 52 28 Z" stroke="#D1D5DB" stroke-width="1.5" fill="none"/>
        <path d="M 54 28 C 53 45, 48 95, 46 102 L 78 102 C 76 95, 71 45, 70 28 Z" fill="#047857"/>
        <path d="M 58 28 Q 62 38 66 28" stroke="url(#goldGrad)" stroke-width="1.5" fill="none"/>
    </g>

    <!-- ============================================== -->
    <!-- RIGHT: PERLENGKAPAN IBADAH & SHOPPING BAGS -->
    <!-- ============================================== -->
    <g transform="translate(340, 200)" filter="url(#dropShadow)">
        <!-- Table/Shelf for Sajadah & Mukena -->
        <rect x="0" y="55" width="95" height="12" rx="3" fill="#70102e" stroke="url(#goldGrad)" stroke-width="1.5"/>
        <line x1="12" y1="67" x2="12" y2="120" stroke="#70102e" stroke-width="3"/>
        <line x1="83" y1="67" x2="83" y2="120" stroke="#70102e" stroke-width="3"/>

        <!-- Sajadah Gulung (Prayer Mat Roll) -->
        <g transform="translate(10, 30)">
            <rect x="0" y="0" width="36" height="24" rx="4" fill="#065F46"/>
            <!-- Motif Sajadah -->
            <path d="M 5 0 L 18 12 L 31 0" stroke="url(#goldGrad)" stroke-width="1.2" fill="none"/>
            <path d="M 5 24 L 18 12 L 31 24" stroke="url(#goldGrad)" stroke-width="1.2" fill="none"/>
            <!-- Rumbai Sajadah -->
            <line x1="36" y1="3" x2="42" y2="3" stroke="#FDE68A" stroke-width="1.5"/>
            <line x1="36" y1="8" x2="42" y2="8" stroke="#FDE68A" stroke-width="1.5"/>
            <line x1="36" y1="13" x2="42" y2="13" stroke="#FDE68A" stroke-width="1.5"/>
            <line x1="36" y1="18" x2="42" y2="18" stroke="#FDE68A" stroke-width="1.5"/>
            <line x1="36" y1="21" x2="42" y2="21" stroke="#FDE68A" stroke-width="1.5"/>
        </g>

        <!-- Mukena Box / Al-Qur'an Rehal Display -->
        <g transform="translate(52, 24)">
            <!-- Rehal (Quran Stand) -->
            <polygon points="12,14 18,28 24,14" fill="#92400E"/>
            <polygon points="6,28 18,14 30,28" fill="#B45309"/>
            <!-- Kitab / Al-Qur'an Gold Trim -->
            <path d="M 6 12 Q 18 16 30 12 L 28 22 Q 18 25 8 22 Z" fill="#047857"/>
            <path d="M 18 15 L 18 24" stroke="url(#goldGrad)" stroke-width="1.5"/>
        </g>

        <!-- Premium Shopping Bag Al-Hidayah (Maroon & Gold Ribbon) -->
        <g transform="translate(15, 75)">
            <rect x="0" y="8" width="45" height="42" rx="4" fill="#881337" stroke="url(#goldGrad)" stroke-width="1.5"/>
            <!-- Handles -->
            <path d="M 12 8 C 12 -2, 33 -2, 33 8" stroke="url(#goldGrad)" stroke-width="2.5" fill="none"/>
            <!-- Logo Lettering -->
            <circle cx="22.5" cy="28" r="10" fill="#5c0d26" stroke="url(#goldGrad)" stroke-width="1"/>
            <text x="22.5" y="32" font-family="'Inter', sans-serif" font-size="9" font-weight="black" fill="#FDE68A" text-anchor="middle">AH</text>
        </g>

        <!-- Small Gift Bag Cream/White -->
        <g transform="translate(48, 86)">
            <rect x="0" y="6" width="35" height="32" rx="3" fill="#FFFBEB" stroke="#B45309" stroke-width="1"/>
            <path d="M 10 6 C 10 -1, 25 -1, 25 6" stroke="#B45309" stroke-width="2" fill="none"/>
            <polygon points="17,14 19,19 24,19 20,22 21,27 17,24 13,27 14,22 10,19 15,19" fill="#F59E0B"/>
        </g>
    </g>

    <!-- Floating Sparkles & Islamic 8-Point Stars -->
    <g fill="url(#goldGrad)" opacity="0.85">
        <!-- Star 1 -->
        <g transform="translate(80, 110) scale(0.9)">
            <polygon points="10,0 13,7 20,10 13,13 10,20 7,13 0,10 7,7"/>
        </g>
        <!-- Star 2 -->
        <g transform="translate(420, 130) scale(0.8)">
            <polygon points="10,0 13,7 20,10 13,13 10,20 7,13 0,10 7,7"/>
        </g>
        <!-- Star 3 -->
        <g transform="translate(170, 150) scale(0.6)">
            <polygon points="10,0 13,7 20,10 13,13 10,20 7,13 0,10 7,7"/>
        </g>
        <!-- Star 4 -->
        <g transform="translate(325, 120) scale(0.7)">
            <polygon points="10,0 13,7 20,10 13,13 10,20 7,13 0,10 7,7"/>
        </g>
    </g>

    <!-- Ambient Glow Orbs -->
    <circle cx="260" cy="180" r="80" fill="#ec4899" opacity="0.08" filter="url(#softGlow)"/>
    <circle cx="150" cy="220" r="50" fill="#F59E0B" opacity="0.08" filter="url(#softGlow)"/>
</svg>

